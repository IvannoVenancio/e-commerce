services:
  ecommerce:
    image: ecommerce
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
   - 3306:3306
  volumes:
   - damartec-default:/var/lib/mysql
  networks:
   - app-network
volumes:
  damartec-default: {}
networks:
  app-network:
   driver: bridge
